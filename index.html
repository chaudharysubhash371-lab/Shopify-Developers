<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NOCTRA</title>

</head>
<body>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-content">
      <h1>Own the Night</h1>
      <p>Crafted for thinkers and creators.</p>
      <a href="#" class="btn">Explore Blends</a>
    </div>
  </section>

  <!-- MOOD SELECTOR -->
  <section class="mood">
    <h2>Choose Your Night Mode</h2>
    <div class="mood-grid">
      <div class="mood-card">⚡ Focus</div>
      <div class="mood-card">🌙 Relax</div>
      <div class="mood-card">🎨 Create</div>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="products">
    <h2>Best Sellers</h2>
    <div class="product-grid">
      <div class="card">
        <img src="assets/images/product1.jpg">
        <h3>Midnight Roast</h3>
        <p>₹799</p>
      </div>
    </div>
  </section>

  <script src="script.js"></script>

</html>
